name: API CI Pipeline

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api-ci.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api-ci.yml'
    branches: [ main, develop ]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-build-and-test:
    name: API Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-contracts

      - name: Validate & Generate Prisma Client
        run: |
          npx prisma format --schema=apps/api/prisma/schema.prisma
          npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run NestJS Unit Tests
        run: npm run test --workspace=apps/api

      - name: Build NestJS API
        run: npm run build --workspace=apps/api
