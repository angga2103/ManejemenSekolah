name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Shared Packages Build & Test
  # ----------------------------------------------------------------------------
  packages-checks:
    name: Shared Packages Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build --workspace=packages/shared-types

      - name: Build API Contracts
        run: npm run build --workspace=packages/api-contracts

  # ----------------------------------------------------------------------------
  # 2. API (NestJS + Prisma) Lint, Typecheck, and Tests
  # ----------------------------------------------------------------------------
  api-checks:
    name: API (NestJS) Quality & Tests
    needs: packages-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-contracts

      - name: Validate & Generate Prisma Client
        run: |
          npx prisma format --schema=apps/api/prisma/schema.prisma
          npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run API Unit Tests
        run: npm run test --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

  # ----------------------------------------------------------------------------
  # 3. Web (React + Tailwind) Lint, Typecheck, and Build
  # ----------------------------------------------------------------------------
  web-checks:
    name: Web Portal Quality & Build
    needs: packages-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/api-contracts

      - name: Build Web
        run: npm run build --workspace=apps/web

  # ----------------------------------------------------------------------------
  # 4. Mobile (Flutter) Analyze and Tests
  # ----------------------------------------------------------------------------
  mobile-checks:
    name: Mobile (Flutter) Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: apps/mobile
        run: flutter test --coverage
