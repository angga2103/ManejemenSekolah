name: edusaas_mobile
description: "Offline-First Mobile Application for Integrated School & Pesantren Management SaaS"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Offline Persistence & Database
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Cryptography & Secure Storage
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

  # Networking & Connectivity
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # QR Code Scanning & Generation
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0

  # State Management & Utilities
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
